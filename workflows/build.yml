name: Build DmaaS Achievement Tracker .exe

on:
  workflow_dispatch:   # adds a manual "Run workflow" button on GitHub

jobs:
  build:
    runs-on: windows-latest   # a real, Microsoft-hosted Windows machine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the .exe
        run: |
          pyinstaller --onefile --windowed --add-data "ui.html;." --name "DmaaS-Achievement-Tracker" app.py

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: DmaaS-Achievement-Tracker-exe
          path: dist/DmaaS-Achievement-Tracker.exe
